spring:
  application:
    name: aiwatch
  profiles:
    active: dev
  lifecycle:
    # 优雅停机每个阶段的最长等待：收到 SIGTERM 后 Tomcat 不再接新请求，最多等 30s 让在途请求（含正在入库的
    # /agent/report）处理完再退出；超时强制关闭，被切断的上报由 agent 下个 tick / outbox 补发。
    # docker-compose 的 stop_grace_period 必须大于它（当前 45s），否则 Docker 会在优雅停机完成前 SIGKILL。
    # 已知代价：控制台的 SSE 长连接算"在途请求"，有管理员开着控制台时停机会等满这 30s。
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        order_inserts: true
        order_updates: true
        jdbc:
          time_zone: Asia/Shanghai
          batch_size: 50
        id:
          optimizer:
            pooled:
              preferred: pooled-lo
  # Boot 的 @Scheduled 池（SSE 心跳 / 员工展示名 / 活跃类型 / 审计扫描）。Boot 默认 1 个线程：审计扫描 tick 会阻塞等一批
  # LLM 调用，期间 25s 一次的 SSE 心跳等全部停摆。3 = 审计扫描占 1 个 + 其余三个毫秒级任务共用。
  # 这个数字是 Hikari 连接总账的一项（每线程至多同时持 1 条），见 BackgroundExecutorConfig 类注释，调大前先重算；
  # BackgroundExecutorConfigTest 会读它。停机限时等待须与 Docker 默认 stop 超时 10s 的预算相加（该类注释里有）。
  task:
    scheduling:
      pool:
        size: 3
      shutdown:
        await-termination: true
        await-termination-period: 2s
  # 离线提醒邮件 SMTP（基础设施级密钥，走 AIWATCH_SMTP_* 环境变量；未配置 host 时不发信、不影响启动）。
  # 行为开关 / 阈值 / 发件人走 sys_config（category=notifications，UI 可热改）。
  mail:
    host: ${AIWATCH_SMTP_HOST:}
    port: ${AIWATCH_SMTP_PORT:465}
    username: ${AIWATCH_SMTP_USER:}
    password: ${AIWATCH_SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${AIWATCH_SMTP_AUTH:true}
          ssl:
            enable: ${AIWATCH_SMTP_SSL:true}
          starttls:
            enable: ${AIWATCH_SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  # port 留给各 profile 自己声明：dev = 8081（默认 8080 给打包后的 prod / aiwatch-server.jar 使用）
  port: 8080
  # 优雅停机（见 spring.lifecycle.timeout-per-shutdown-phase）。停机开始时 Tomcat 立刻停止接受新连接
  # （端口不再响应，探针看到的是"连接被拒"而不是 503），在途请求最多再等 30s；同时 readiness 状态置 REFUSING_TRAFFIC，
  # 进程内依赖 readiness 的逻辑（如上报舱壁）可据此拒收。
  shutdown: graceful
  tomcat:
    # Cursor 等大 payload：单次 /report 解压后 JSON 可达数 MB～十余 MB；连接器默认 maxPostSize≈2MB
    # 会触发读取/解析异常并在全局处理器里表现为 code=50000。生产务必放宽。
    max-http-form-post-size: 512MB
    threads:
      # 上面那条注释就是这里必须限流的原因：HMAC 校验要求把整个请求体读进内存
      # （CachedBodyHttpServletRequest，gzip 请求还会再持有一份解压副本），
      # 所以「并发数 × 单请求体积」直接吃堆。容器是 -Xmx2g（见 Dockerfile），
      # 按单请求 ~12MB 峰值算，默认的 200 线程最坏情况要 2.4G —— 超过堆上限。
      # 50 线程 ≈ 600MB 峰值，留足余量；而实际上报量级只有个位数 QPS，50 绰绰有余。
      # 打满后新连接进 accept 队列排队，比 OOM 好。
      max: 50
      min-spare: 10
    # —— 连接层超时 / 队列：与"50 线程 / 16 重上报并发 / Hikari 40"相称，逐项说明为什么改或为什么不改 ——
    # connection-timeout（默认 60s → 20s）：Tomcat 读请求行 / 请求体时，两次读之间最长等多久。
    #   HMAC 要求整包读进内存，读 body 期间这条请求占着 1 个 Tomcat 线程（重上报还占 1 个舱壁名额）。
    #   员工笔记本合盖 / 断网会让上传半途"哑掉"，60s 才回收 = 16 个名额里每个半死连接多占 1 分钟。
    #   20s 仍远大于正常的包间隔（TCP 有数据就持续到达），只砍真正卡死的连接。注意它是"读空闲"而非"总时长"，
    #   慢速但持续的大包上传不受影响（agent 侧整请求超时是 15 分钟）。响应写超时同样用它，砍掉不读响应的僵尸客户端。
    connection-timeout: 20s
    # keep-alive-timeout：显式钉成 60s（即改 connection-timeout 之前的实际值），不随上一项被连带缩短。
    #   空闲 keep-alive 连接只占 fd 不占线程，没必要缩；反代（nginx upstream keepalive_timeout 默认 60s）
    #   后面这个值应 ≥ 反代的上游空闲超时，否则会出现"反代复用了刚被 Tomcat 关掉的连接"的偶发 502。
    keep-alive-timeout: 60s
    # accept-count / max-connections 保持 Tomcat 默认值，刻意不动（显式写出是为了钉住、并留下理由）：
    #   - NIO 下"线程满"不会让新连接被拒，请求排在 executor 队列里等线程；真正的限流靠 50 线程 + 16 重上报舱壁
    #     + Hikari 40，而不是这两个参数。
    #   - max-connections=8192 只是同时打开的 socket 上限（含空闲 keep-alive）。员工机个位数 QPS、每 2 分钟一 tick，
    #     实际远低于此；调小会在机器数增长时先把正常客户端拒之门外，调大没有收益。
    #   - accept-count=100 是 max-connections 用尽后 OS 层 backlog 的长度，正常负载碰不到。
    accept-count: 100
    max-connections: 8192
    # 让 Micrometer 暴露 tomcat_threads_busy_threads / tomcat_threads_config_max_threads 等指标
    # （2026-09 事故就是 50 线程打满，见 docs/ops/monitoring.md）。开销可忽略。
    mbeanregistry:
      enabled: true
  compression:
    enabled: true
    # 这里是**覆盖**不是追加：列表里没有的类型一律不压缩。Boot 3 把 .js 映射成 text/javascript
    # （不是 application/javascript），以前漏了它，控制台 JS（antd 1.3MB / echarts 等）全程明文下发，
    # 首屏多传约 3 倍字节。新增静态资源类型时先查 MimeMappings.DEFAULT，由 CompressionConfigTest 兜底。
    # 不要加 text/event-stream：SSE 压缩后会被缓冲，实时推送就不实时了。
    mime-types: application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
  servlet:
    session:
      # 管理员会话默认 7 天滑动；JSESSIONID Cookie，重启会清空（管理员需重新登录）
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # prometheus 端点不匿名开放：SecurityConfig 只放行 health / health/liveness / health/readiness / info，
        # 其余 /actuator/** 一律 authenticated()（管理员会话，或 X-Admin-Token 头，方便 Prometheus 抓取）。
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      # 开启 /actuator/health/liveness 与 /actuator/health/readiness 两个探针分组。
      # /actuator/health 本身仍是含 db / 磁盘的完整健康（两个 *State 指示器会一并出现在里面）。
      probes:
        enabled: true
      group:
        # liveness 只反映"JVM 进程自己是否还活着"，刻意不含 db / 磁盘：数据库抖动时重启应用没有任何好处，
        # 还会把一次短暂故障放大成整包上报失败 + 重启风暴。
        liveness:
          include: livenessState
        # readiness 只含 readinessState：Spring Boot 要等所有 ApplicationRunner（启动期 SchemaPatches / 回填）
        # 跑完才置 ACCEPTING_TRAFFIC，停机时置 REFUSING_TRAFFIC（且端口随即停止接受连接）。所以它回答的是"能不能接流量"，
        # 而不是"依赖是否健康"——依赖故障由 /actuator/health 与告警表达，不通过 readiness 让上游整体摘流。
        readiness:
          include: readinessState
  health:
    # 不把 SMTP 连通性算进 /actuator/health：spring-boot-starter-mail 会自动注册 mail 健康项，
    # 而 AIWATCH_SMTP_HOST 留空（文档明确"不影响启动"）时它恒为 DOWN → 整个 health 回 503；
    # 配了 SMTP 但邮件服务暂时不可达时同样。离线提醒邮件是尽力而为的通知，不该决定"服务是否健康"。
    mail:
      enabled: false
  metrics:
    tags:
      # 多套环境 / 多实例共用一个 Prometheus 时用来区分；不引入高基数标签。
      application: ${spring.application.name}
    distribution:
      # 只给 http.server.requests 开直方图桶（用于 /api/v1/agent/report 等接口的 P99），其余指标保持默认。
      # 用固定 SLO 桶而不是 percentiles-histogram：后者按 1ms~30s 自动生成约 70 个桶，乘上
      # uri × method × status × outcome 的标签组合会让序列数膨胀；这里 10 个桶 + count/sum/max 足够做告警。
      # 桶上限 60s：单请求超过 60s 就是事故，落入 +Inf 桶即可。histogram_quantile 的精度受桶边界限制。
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s

logging:
  level:
    root: INFO
    com.am.server: INFO
    org.hibernate.SQL: WARN

# AIWatch 业务参数。前缀 aiwatch 为 v2.0 起的标准 namespace；
# 当前 Java 端没有 @ConfigurationProperties 直接读这里（保留为运行时配置预留位）。
aiwatch:
  agent:
    heartbeat-interval-seconds: 60
    max-heartbeat-gap-seconds: 180
    timestamp-window-seconds: 300
    min-agent-version: 1.0.0
    # 设备在线判定：last_seen 距现在不超过此秒数。默认 300（5min）≈ 2.5× 默认 2min 上报间隔。
    online-window-seconds: 300
    # 会话活跃判定：ingest 侧 last_activity 窗口，与客户端 ActivityTimeout 对齐。
    activity-window-seconds: 300
    # 单次 /report 推进 work_session 时长上限（与 report_interval 一致）。
    per-report-cap-seconds: 120
    # 同时处理的「重」agent 上报上限（≤2KB 的心跳小包不占名额），超出直接 503、客户端下个 tick 重报。
    # 必须明显小于 Hikari 池（prod 40），给控制台 / 定时任务 / 心跳留连接。见 AgentIngestBulkheadFilter。
    ingest-max-concurrency: 16
    # 等重名额的最长时间（ms）。0 = 拿不到立即 503、不排队：被拒请求每多等一毫秒都占着一个 Tomcat 线程
    # （prod 只有 50 个），排队会把剩余线程也吃光。旧值 500 已废弃。
    ingest-acquire-timeout-ms: 0
    # 轻请求（Content-Length ≤2KB：心跳 / 空闲 tick，以及 /register）的独立并发上限与最长等待（ms，≤200）。
    ingest-light-max-concurrency: 8
    ingest-light-acquire-timeout-ms: 200
    # 老客户端（agent_version < legacy-client-below-version，即 1.3.3 之前，收到 503 仍落 outbox 快节奏重报）
    # 的重请求独立小名额；验签通过后扣，超额 503。<=0 关闭。
    ingest-legacy-max-concurrency: 2
    legacy-client-below-version: 1.3.3
    # 请求体上限（字节）。线上字节（gzip 后）> max-body-bytes、解压后 > max-decoded-body-bytes、或压缩比 > max-gzip-ratio
    # 一律 HTTP 413（确定性失败，重发无用）。1.3.3 之前的老客户端首次回填过大会持续 413，属有意。
    max-body-bytes: 33554432            # 32MB
    max-decoded-body-bytes: 67108864    # 64MB
    max-gzip-ratio: 100
    # 所有在途重请求的估算堆占用总预算（字节，默认 512MB = -Xmx2g 的 1/4；明文按 3x、gzip 按 线上+3x解压 计价）。
    # 预占不到 503。必须 >= 3 x max-body-bytes。最坏情况算术见 AgentIngestBulkheadFilter Javadoc。
    ingest-inflight-bytes-budget: 536870912   # 512MB
    # 未认证的 /agent/register 请求体上限（字节）。
    register-max-body-bytes: 65536
    # agent_alert 写入限速与保留期：同 (agentId,type,level) 在窗口内只写一条；全局每分钟上限；保留天数
    # （运行期以 sys_config agent.alert_retention_days 为准，<=0 不清理）。见 AlertService / AgentAlertRetentionCleaner。
    alert-dedup-window-minutes: 5
    alert-max-per-minute: 120
    alert-retention-days: 30
  capture:
    max-text-bytes-per-part: 524288
    max-blob-bytes-per-part: 1048576
    max-blobs-per-message: 8
    max-parts-per-message: 64
    inline-blob-max-bytes: 32768
    audit-message-max-chars: 4000

