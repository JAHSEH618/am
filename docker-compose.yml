# AIWatch Docker 部署编排（server + MySQL）
# 使用前：cp .env.example .env 并填入真实密码，详见 docs/guides/docker-deploy-centos.md
#
#   docker compose build      # 首次较久：拉依赖 + 编前端 + 编 agent
#   docker compose up -d
#   docker compose logs -f server
#
# 版本号：改 .env 里的 AIWATCH_VERSION 即可同步镜像 tag、jar、agent 分发版本。
# 升级后建议：./scripts/deploy.sh（内置清理）或 bash scripts/docker-prune-safe.sh

# 容器日志轮转：json-file 默认无上限，长期运行会把 /var/lib/docker 撑满。
# 每容器最多保留 5×20MB=100MB 历史日志（需完整日志用 docker compose logs 前先调大）。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: aiwatch-mysql
    restart: unless-stopped
    logging: *default-logging
    # MySQL 收到 SIGTERM 后要刷脏页、落 buffer pool dump；缓冲池调大后 docker 默认的 10s 停止超时不够，
    # 被 SIGKILL 会走一遍崩溃恢复（数据安全，但下次启动慢、且日志里全是恢复信息）。给足 60s。
    stop_grace_period: 60s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # InnoDB 缓冲池：MySQL 默认只有 128MB，对本项目的整窗聚合（扫 ai_session_event / message）远远不够，
      # 会退化成大量磁盘读。取值随机器内存变，cnf 里无法引用环境变量，所以放在这里，由 .env 覆盖。
      # 默认 1G 适合 4G 内存且与 server 同机的部署；怎么按内存选值见 .env.example 与 docs/guides/docker-deploy-centos.md。
      # 命令行参数优先级高于 docker/mysql/aiwatch.cnf，cnf 里因此不再重复设置。
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-1G}
      # 其余静态参数（max_connections=300 / innodb_lock_wait_timeout=10 / binlog_expire_logs_seconds=3d …）
      # 都在下面挂载的 docker/mysql/aiwatch.cnf 里，附理由。max_connections 需 ≥ HikariCP 池上限（prod=40）。
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: am
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 仓库内维护的 MySQL 参数（见文件头说明）。改完需 docker compose restart mysql；文件权限保持 644，
      # 任何人可写的 cnf 会被 MySQL 忽略。
      - ./docker/mysql/aiwatch.cnf:/etc/mysql/conf.d/aiwatch.cnf:ro
      # 首次启动（数据卷为空时）自动导入表结构 + 种子数据（含默认管理员）
      - ./server/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 如需宿主机直接连库，解开下面两行（生产不建议对公网暴露 3306）：
    # ports:
    #   - "3306:3306"

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 与 image tag、agent 分发版本对齐；默认与 server/build.gradle 当前 version 一致
        VERSION: ${AIWATCH_VERSION:-1.3.3}
    image: aiwatch-server:${AIWATCH_VERSION:-1.3.3}
    container_name: aiwatch-server
    # 只有进程退出才会被 Docker 重启（unhealthy 本身不会触发重启）。所以 JVM 出现 OOM 时靠
    # -XX:+ExitOnOutOfMemoryError 让进程退出（见 Dockerfile）；要"卡死也自动重启"见 docs/ops/monitoring.md 的 autoheal 一节。
    restart: unless-stopped
    # 优雅停机窗口：必须大于 spring.lifecycle.timeout-per-shutdown-phase（30s，application.yml），
    # 否则 Docker 会在应用把在途上报处理完之前 SIGKILL。留 15s 给 JVM 关连接池 / 线程池。
    stop_grace_period: 45s
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AIWATCH_INSTALL_DIR: /srv/aiwatch/install
      # 追加 JVM 参数（排在最后，同名参数以它为准）。例：临时加堆 -Xmx3g。
      JAVA_OPTS_EXTRA: ${AIWATCH_JAVA_OPTS_EXTRA:-}
      # OOM 堆转储开关与最小剩余空间（MB）。逻辑在 docker/entrypoint.sh：/dumps 已挂载且剩余空间 ≥ 阈值才开启。
      AIWATCH_HEAPDUMP: ${AIWATCH_HEAPDUMP:-on}
      AIWATCH_HEAPDUMP_MIN_FREE_MB: ${AIWATCH_HEAPDUMP_MIN_FREE_MB:-4096}
      # 数据库事务隔离级别开关，默认保持 REPEATABLE_READ。切 TRANSACTION_READ_COMMITTED 前必读
      # docs/ops/read-committed-evaluation.md。此处的默认值必须与 application-prod.yml 一致
      # （env 一旦存在就不会回落到 yml 默认值，空值也算存在，所以不能留空）。
      AIWATCH_DB_ISOLATION: ${AIWATCH_DB_ISOLATION:-TRANSACTION_REPEATABLE_READ}
      # JDBC socketTimeout（毫秒；0 = 不设上限）。默认值同上，须与 application-prod.yml 一致。
      # 发版含"对超大表的一次性启动期 DDL 补丁"时可临时设 0，见 application-prod.yml 的说明。
      AIWATCH_DB_SOCKET_TIMEOUT_MS: ${AIWATCH_DB_SOCKET_TIMEOUT_MS:-600000}
      # 离线提醒邮件 SMTP（值在 .env 配；未配 HOST 时不发信、不影响启动）。
      # 465 端口→SSL=true STARTTLS=false；587 端口→SSL=false STARTTLS=true。
      AIWATCH_SMTP_HOST: ${AIWATCH_SMTP_HOST:-}
      AIWATCH_SMTP_PORT: ${AIWATCH_SMTP_PORT:-465}
      AIWATCH_SMTP_USER: ${AIWATCH_SMTP_USER:-}
      AIWATCH_SMTP_PASS: ${AIWATCH_SMTP_PASS:-}
      AIWATCH_SMTP_SSL: ${AIWATCH_SMTP_SSL:-true}
      AIWATCH_SMTP_STARTTLS: ${AIWATCH_SMTP_STARTTLS:-false}
      TZ: Asia/Shanghai
    ports:
      - "9527:9527"
    # 探 readiness 而不是 /actuator/health：
    #   - Spring Boot 要等所有 ApplicationRunner（启动期 SchemaPatches / 回填）跑完才把 readiness 置为 UP，
    #     所以"UP"真的表示能接流量；停机时端口随即停止接受连接。
    #   - /actuator/health 含 db / 磁盘，且曾把 SMTP 算进去，会因外部依赖抖动而变红，与"能否接流量"无关。
    #   - curl 需要一个空闲的 Tomcat 线程来应答：50 个线程全被占满（2026-09 事故）时探测会超时 → unhealthy，
    #     这正是我们想看到的信号。
    # start_period 内的失败不计入 retries。120s 覆盖常规启动补丁；但"首次升级到带大回填的版本"
    # （capability_daily / git_commit_attribution 等，大库可能几十分钟）readiness 会持续 503：
    # 这是预期行为（此期间 /agent/report 被拒、agent 会重试），unhealthy 只是提示，compose 不会因它重启容器。
    # 若你部署了 autoheal（会因 unhealthy 重启容器），务必把 start_period 调到 ≥ 最长回填时间，否则会陷入重启循环。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9527/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      # JVM OOM 堆转储目录（docker/entrypoint.sh 会加 -XX:HeapDumpPath=/dumps/aiwatch-oom.hprof）。
      # 转储最大约 2GB，且含内存中的会话内容 / 凭据——必须挂独立卷，别让它落进容器可写层 / 根分区
      # （2026-07 根分区被打满过）。取舍：
      #   - 默认是命名卷 heapdumps，位于 Docker data-root（/var/lib/docker/volumes，默认在根分区）。
      #     入口脚本启动时会检查该盘剩余空间，不足 AIWATCH_HEAPDUMP_MIN_FREE_MB（默认 4096MB）就自动关闭转储并打 WARN，
      #     所以"根分区所剩无几"时不会因写转储把最后的空间吃光；代价是这种机器上 OOM 没有转储。
      #     若已按 docs/guides/docker-deploy-centos.md 4.2 把 data-root 迁到大分区，就没有这个问题。
      #   - 想直接指定宿主机大盘目录：.env 里设 AIWATCH_HEAPDUMP_DIR=/data/aiwatch-dumps（绝对路径 = bind mount）。
      #   - 不想要堆转储：.env 里设 AIWATCH_HEAPDUMP=off（此卷可保留，无害）。
      - ${AIWATCH_HEAPDUMP_DIR:-heapdumps}:/dumps
      # 想"不重建镜像"就更新客户端分发包时，解开下面一行用宿主目录覆盖镜像内置分发包：
      #   - ./agent/dist/install:/srv/aiwatch/install:ro

volumes:
  mysql-data:
  # OOM 堆转储（见 server 的 volumes 注释）；AIWATCH_HEAPDUMP_DIR 设为绝对路径时本卷不被使用。
  heapdumps:
