spring:
  application:
    name: aiwatch
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        order_inserts: true
        order_updates: true
        jdbc:
          time_zone: Asia/Shanghai
          batch_size: 50
        id:
          optimizer:
            pooled:
              preferred: pooled-lo
  # 离线提醒邮件 SMTP（基础设施级密钥，走 AIWATCH_SMTP_* 环境变量；未配置 host 时不发信、不影响启动）。
  # 行为开关 / 阈值 / 发件人走 sys_config（category=notifications，UI 可热改）。
  mail:
    host: ${AIWATCH_SMTP_HOST:}
    port: ${AIWATCH_SMTP_PORT:465}
    username: ${AIWATCH_SMTP_USER:}
    password: ${AIWATCH_SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${AIWATCH_SMTP_AUTH:true}
          ssl:
            enable: ${AIWATCH_SMTP_SSL:true}
          starttls:
            enable: ${AIWATCH_SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  # port 留给各 profile 自己声明：dev = 8081（默认 8080 给打包后的 prod / aiwatch-server.jar 使用）
  port: 8080
  tomcat:
    # Cursor 等大 payload：单次 /report 解压后 JSON 可达数 MB～十余 MB；连接器默认 maxPostSize≈2MB
    # 会触发读取/解析异常并在全局处理器里表现为 code=50000。生产务必放宽。
    max-http-form-post-size: 512MB
    threads:
      # 上面那条注释就是这里必须限流的原因：HMAC 校验要求把整个请求体读进内存
      # （CachedBodyHttpServletRequest，gzip 请求还会再持有一份解压副本），
      # 所以「并发数 × 单请求体积」直接吃堆。容器是 -Xmx2g（见 Dockerfile），
      # 按单请求 ~12MB 峰值算，默认的 200 线程最坏情况要 2.4G —— 超过堆上限。
      # 50 线程 ≈ 600MB 峰值，留足余量；而实际上报量级只有个位数 QPS，50 绰绰有余。
      # 打满后新连接进 accept 队列排队，比 OOM 好。
      max: 50
      min-spare: 10
  compression:
    enabled: true
    # 这里是**覆盖**不是追加：列表里没有的类型一律不压缩。Boot 3 把 .js 映射成 text/javascript
    # （不是 application/javascript），以前漏了它，控制台 JS（antd 1.3MB / echarts 等）全程明文下发，
    # 首屏多传约 3 倍字节。新增静态资源类型时先查 MimeMappings.DEFAULT，由 CompressionConfigTest 兜底。
    # 不要加 text/event-stream：SSE 压缩后会被缓冲，实时推送就不实时了。
    mime-types: application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
  servlet:
    session:
      # 管理员会话默认 7 天滑动；JSESSIONID Cookie，重启会清空（管理员需重新登录）
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.am.server: INFO
    org.hibernate.SQL: WARN

# AIWatch 业务参数。前缀 aiwatch 为 v2.0 起的标准 namespace；
# 当前 Java 端没有 @ConfigurationProperties 直接读这里（保留为运行时配置预留位）。
aiwatch:
  agent:
    heartbeat-interval-seconds: 60
    max-heartbeat-gap-seconds: 180
    timestamp-window-seconds: 300
    min-agent-version: 1.0.0
    # 设备在线判定：last_seen 距现在不超过此秒数。默认 300（5min）≈ 2.5× 默认 2min 上报间隔。
    online-window-seconds: 300
    # 会话活跃判定：ingest 侧 last_activity 窗口，与客户端 ActivityTimeout 对齐。
    activity-window-seconds: 300
    # 单次 /report 推进 work_session 时长上限（与 report_interval 一致）。
    per-report-cap-seconds: 120
    # 同时处理的「重」agent 上报上限（≤2KB 的心跳小包不占名额），超出直接 503、客户端下个 tick 重报。
    # 必须明显小于 Hikari 池（prod 40），给控制台 / 定时任务 / 心跳留连接。见 AgentIngestBulkheadFilter。
    ingest-max-concurrency: 16
    # 等重名额的最长时间（ms）。0 = 拿不到立即 503、不排队：被拒请求每多等一毫秒都占着一个 Tomcat 线程
    # （prod 只有 50 个），排队会把剩余线程也吃光。旧值 500 已废弃。
    ingest-acquire-timeout-ms: 0
    # 轻请求（Content-Length ≤2KB：心跳 / 空闲 tick，以及 /register）的独立并发上限与最长等待（ms，≤200）。
    ingest-light-max-concurrency: 8
    ingest-light-acquire-timeout-ms: 200
    # 老客户端（agent_version < legacy-client-below-version，即 1.3.3 之前，收到 503 仍落 outbox 快节奏重报）
    # 的重请求独立小名额；验签通过后扣，超额 503。<=0 关闭。
    ingest-legacy-max-concurrency: 2
    legacy-client-below-version: 1.3.3
    # 请求体上限（字节）。线上字节（gzip 后）> max-body-bytes、解压后 > max-decoded-body-bytes、或压缩比 > max-gzip-ratio
    # 一律 HTTP 413（确定性失败，重发无用）。1.3.3 之前的老客户端首次回填过大会持续 413，属有意。
    max-body-bytes: 33554432            # 32MB
    max-decoded-body-bytes: 67108864    # 64MB
    max-gzip-ratio: 100
    # 所有在途重请求的估算堆占用总预算（字节，默认 512MB = -Xmx2g 的 1/4；明文按 3x、gzip 按 线上+3x解压 计价）。
    # 预占不到 503。必须 >= 3 x max-body-bytes。最坏情况算术见 AgentIngestBulkheadFilter Javadoc。
    ingest-inflight-bytes-budget: 536870912   # 512MB
    # 未认证的 /agent/register 请求体上限（字节）。
    register-max-body-bytes: 65536
    # agent_alert 写入限速与保留期：同 (agentId,type,level) 在窗口内只写一条；全局每分钟上限；保留天数
    # （运行期以 sys_config agent.alert_retention_days 为准，<=0 不清理）。见 AlertService / AgentAlertRetentionCleaner。
    alert-dedup-window-minutes: 5
    alert-max-per-minute: 120
    alert-retention-days: 30
  capture:
    max-text-bytes-per-part: 524288
    max-blob-bytes-per-part: 1048576
    max-blobs-per-message: 8
    max-parts-per-message: 64
    inline-blob-max-bytes: 32768
    audit-message-max-chars: 4000

