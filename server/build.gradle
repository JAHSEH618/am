plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'com.github.node-gradle.node' version '7.0.2'
}

group = 'com.am'
version = '1.0.14'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 源码含中文字面量（如 monitor_target 种子 description）：强制 javac 以 UTF-8 读源码，
// 否则非 UTF-8 locale 的构建机（CI/容器）会把中文编坏，重新引入"乱码"。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    // mavenLocal 优先：开发机离线 fallback，不影响生产构建（生产仍走 mavenCentral）
    mavenLocal()
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.13.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.13.0'

    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ================== 前端构建集成（设计文档 20.2 节） ==================
//
// node 插件会自动下载 Node 与 pnpm，开发机不要求安装 pnpm。
// 前端源码：src/main/frontend
// 构建产物：src/main/resources/static（由 vite.config 的 outDir 指定）
//
// processResources 任务依赖 frontendBuild，从而保证 bootJar / bootRun
// 都能拿到最新的前端构建产物。

node {
    download = true
    version = '22.14.0'
    pnpmVersion = '9.15.0'
    workDir = file("${layout.buildDirectory.get()}/nodejs")
    pnpmWorkDir = file("${layout.buildDirectory.get()}/pnpm")
    nodeProjectDir = file("${projectDir}/src/main/frontend")
}

tasks.register('frontendInstall', com.github.gradle.node.pnpm.task.PnpmTask) {
    description = '在 src/main/frontend 中执行 pnpm install'
    args = ['install']
    inputs.file("${projectDir}/src/main/frontend/package.json")
    outputs.dir("${projectDir}/src/main/frontend/node_modules")
}

tasks.register('frontendBuild', com.github.gradle.node.pnpm.task.PnpmTask) {
    description = '在 src/main/frontend 中执行 pnpm run build，产物输出到 ../resources/static'
    dependsOn 'frontendInstall'
    args = ['run', 'build']
    inputs.dir("${projectDir}/src/main/frontend/src")
    inputs.file("${projectDir}/src/main/frontend/package.json")
    inputs.file("${projectDir}/src/main/frontend/vite.config.ts")
    outputs.dir("${projectDir}/src/main/resources/static")
}

processResources {
    dependsOn 'frontendBuild'
}

clean {
    delete "${projectDir}/src/main/resources/static"
    delete "${projectDir}/src/main/frontend/dist"
}

bootJar {
    archiveBaseName = 'aiwatch-server'
    archiveVersion = project.version
}
